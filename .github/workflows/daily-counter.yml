name: Daily counter

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      naturalize_2026:
        description: "Spread random brightness across all of 2026"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-counter
  cancel-in-progress: false

jobs:
  increment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "IManss-ai"
          git config user.email "254088976+IManss-ai@users.noreply.github.com"
          git config gc.auto 0
          git config maintenance.auto false

      - name: Create varied 2026 history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.naturalize_2026 == true }}
        shell: bash
        run: |
          python scripts/generate_activity.py \
            --start-date 2026-01-01 \
            --end-date 2026-12-31 \
            --push-every 400

      - name: Create today's varied activity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.naturalize_2026 != true }}
        shell: bash
        run: |
          TODAY=$(TZ=Asia/Qyzylorda date +%F)
          python scripts/generate_activity.py \
            --start-date "$TODAY" \
            --end-date "$TODAY" \
            --push-every 400
